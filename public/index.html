<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #ffffff;
      --surface-muted: #f0ede6;
      --border: #e5e0d5;
      --border-strong: #d4cec0;
      --ink: #18181b;
      --ink-muted: #57534e;
      --ink-subtle: #78716c;
      --sage: #2d6a4f;
      --sage-soft: #e9f2ed;
      --danger: #b91c1c;
      --danger-bright: #dc2626;
      --danger-soft: #fef2f2;
      --danger-border: #fecaca;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      padding: 36px 18px 48px;
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 1060px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .eyebrow {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-subtle);
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 650;
      letter-spacing: -0.025em;
      color: var(--ink);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 840px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--surface);
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(24, 24, 27, 0.04);
      border: 1px solid var(--border);
      padding: 22px;
    }
    .card h2 {
      font-size: 0.92rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .summary-box {
      background-color: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .summary-total {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      margin-bottom: 10px;
    }
    .summary-categories {
      font-size: 0.85rem;
      color: var(--ink-muted);
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-variant-numeric: tabular-nums;
    }
    .summary-cat-line {
      display: flex;
      justify-content: space-between;
      padding-top: 4px;
      border-top: 1px dashed var(--border);
    }
    .summary-cat-line:first-child {
      border-top: none;
      padding-top: 0;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 520px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
    input, select {
      padding: 9px 11px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: var(--surface);
      color: var(--ink);
      width: 100%;
    }
    input:focus, select:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.08);
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button.btn-primary {
      background: var(--ink);
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 10px 16px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      flex: 1;
    }
    button.btn-primary:hover {
      background: #27272a;
    }
    button.btn-primary:active {
      transform: translateY(1px);
    }
    button.btn-secondary, a.btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border-strong);
      font-size: 0.84rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    button.btn-secondary:hover, a.btn-secondary:hover {
      background: var(--surface-muted);
      border-color: var(--ink-subtle);
    }
    #error {
      min-height: 20px;
      font-size: 0.85rem;
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 500;
      text-align: center;
    }
    #error:empty {
      display: none;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (max-width: 640px) {
      .filters {
        grid-template-columns: 1fr 1fr;
      }
    }
    ul#list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    ul#list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      flex-wrap: wrap;
      transition: border-color 0.15s, background-color 0.15s;
    }
    ul#list li:hover {
      border-color: var(--border-strong);
      background: #fdfcfa;
    }
    .expense-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .expense-title {
      font-weight: 600;
      font-size: 0.94rem;
      color: var(--ink);
    }
    .expense-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--ink-subtle);
      font-variant-numeric: tabular-nums;
    }
    .expense-cat {
      background: var(--surface-muted);
      color: var(--ink-muted);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .expense-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .expense-amount {
      font-weight: 700;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      color: var(--sage);
      margin-right: 4px;
    }
    .btn-edit {
      background: transparent;
      color: var(--ink-muted);
      border: 1px solid var(--border-strong);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-edit:hover {
      background: var(--surface-muted);
      color: var(--ink);
      border-color: var(--ink-subtle);
    }
    .btn-delete {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger-border);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn-delete:hover {
      background: var(--danger-soft);
    }
    .empty-state {
      text-align: center;
      font-size: 0.875rem;
      color: var(--ink-subtle);
      padding: 18px 0;
    }
    .budget-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .budget-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .budget-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.83rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--ink-muted);
    }
    .budget-header.over {
      color: var(--danger);
    }
    .budget-bar-track {
      width: 100%;
      height: 7px;
      background: var(--surface-muted);
      border-radius: 999px;
      overflow: hidden;
    }
    .budget-bar-fill {
      height: 100%;
      background: var(--sage);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .budget-bar-fill.over-budget {
      background: var(--danger-bright);
    }
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 640px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }
    .chart-wrap {
      position: relative;
      height: 220px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="eyebrow">Personal Ledger</span>
        <h1>Expense Tracker</h1>
      </div>
      <div class="btn-row">
        <button type="button" id="exportCsvBtn" class="btn-secondary">Export CSV</button>
      </div>
    </header>

    <p id="error"></p>

    <div class="grid">
      <div class="stack">
        <section class="card">
          <h2 id="formHeading">Add Expense</h2>
          <form id="expenseForm">
            <div class="form-group">
              <label for="title">Title</label>
              <input type="text" id="title" placeholder="e.g. Lunch" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required />
              </div>
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                  <option value="Food">Food</option>
                  <option value="Travel">Travel</option>
                  <option value="Study">Study</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" required />
            </div>

            <div class="btn-row">
              <button type="submit" id="submitBtn" class="btn-primary">Add Expense</button>
              <button type="button" id="cancelEditBtn" class="btn-secondary" style="display: none;">Cancel</button>
            </div>
          </form>
        </section>

        <section class="card">
          <h2>Monthly Budgets (<span id="budgetMonth"></span>)</h2>
          <form id="budgetForm">
            <div class="form-row">
              <div class="form-group">
                <label for="budgetCategory">Category</label>
                <select id="budgetCategory">
                  <option value="Food">Food</option>
                  <option value="Travel">Travel</option>
                  <option value="Study">Study</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="budgetAmount">Monthly Limit (₹)</label>
                <input type="number" id="budgetAmount" step="0.01" min="0" placeholder="5000" required />
              </div>
            </div>
            <button type="submit" class="btn-primary">Save Budget</button>
          </form>
          <div id="budgetList" class="budget-list"></div>
        </section>
      </div>

      <div class="stack">
        <section class="card">
          <h2>Summary & Charts</h2>
          <div class="summary-box">
            <div id="totalSpent" class="summary-total">Total spent: ₹0.00</div>
            <div id="categorySummary" class="summary-categories"></div>
          </div>
          <div class="charts-grid">
            <div class="chart-wrap">
              <canvas id="categoryChart"></canvas>
            </div>
            <div class="chart-wrap">
              <canvas id="monthlyChart"></canvas>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Expenses</h2>
          <div class="filters">
            <div class="form-group">
              <label for="filterCategory">Category</label>
              <select id="filterCategory">
                <option value="">All</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Study">Study</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="filterFrom">From</label>
              <input type="date" id="filterFrom" />
            </div>
            <div class="form-group">
              <label for="filterTo">To</label>
              <input type="date" id="filterTo" />
            </div>
            <div class="form-group">
              <label for="filterSort">Sort</label>
              <select id="filterSort">
                <option value="date_desc">Newest</option>
                <option value="date_asc">Oldest</option>
                <option value="amount_desc">Highest ₹</option>
                <option value="amount_asc">Lowest ₹</option>
              </select>
            </div>
          </div>
          <div class="btn-row" style="margin-bottom: 12px;">
            <button type="button" id="clearFiltersBtn" class="btn-secondary">Clear Filters</button>
          </div>
          <ul id="list"></ul>
        </section>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("expenseForm");
    const formHeading = document.getElementById("formHeading");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const titleInput = document.getElementById("title");
    const amountInput = document.getElementById("amount");
    const categorySelect = document.getElementById("category");
    const dateInput = document.getElementById("date");

    const filterCategory = document.getElementById("filterCategory");
    const filterFrom = document.getElementById("filterFrom");
    const filterTo = document.getElementById("filterTo");
    const filterSort = document.getElementById("filterSort");
    const clearFiltersBtn = document.getElementById("clearFiltersBtn");
    const exportCsvBtn = document.getElementById("exportCsvBtn");

    const budgetForm = document.getElementById("budgetForm");
    const budgetCategory = document.getElementById("budgetCategory");
    const budgetAmount = document.getElementById("budgetAmount");
    const budgetMonthEl = document.getElementById("budgetMonth");
    const budgetListEl = document.getElementById("budgetList");

    const listEl = document.getElementById("list");
    const errorEl = document.getElementById("error");
    const totalSpentEl = document.getElementById("totalSpent");
    const categorySummaryEl = document.getElementById("categorySummary");

    let editingId = null;
    let categoryChartInstance = null;
    let monthlyChartInstance = null;

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    dateInput.value = todayISO();

    function showError(msg) {
      errorEl.textContent = msg;
    }

    function clearError() {
      errorEl.textContent = "";
    }

    function buildFilterParams(includeSort = true) {
      const params = new URLSearchParams();
      if (filterCategory.value) params.set("category", filterCategory.value);
      if (filterFrom.value) params.set("from", filterFrom.value);
      if (filterTo.value) params.set("to", filterTo.value);
      if (includeSort && filterSort.value) params.set("sort", filterSort.value);
      return params.toString();
    }

    function resetFormMode() {
      editingId = null;
      formHeading.textContent = "Add Expense";
      submitBtn.textContent = "Add Expense";
      cancelEditBtn.style.display = "none";
      titleInput.value = "";
      amountInput.value = "";
      categorySelect.value = "Food";
      dateInput.value = todayISO();
    }

    function startEdit(item) {
      editingId = item.id;
      formHeading.textContent = "Edit Expense";
      submitBtn.textContent = "Save Changes";
      cancelEditBtn.style.display = "inline-flex";
      titleInput.value = item.title;
      amountInput.value = item.amount;
      categorySelect.value = item.category;
      dateInput.value = item.date || todayISO();
      titleInput.focus();
    }

    async function loadData() {
      try {
        const expQuery = buildFilterParams(true);
        const sumParams = new URLSearchParams();
        if (filterFrom.value) sumParams.set("from", filterFrom.value);
        if (filterTo.value) sumParams.set("to", filterTo.value);
        const sumQuery = sumParams.toString();

        const [expRes, sumRes, monthlyRes, budgetRes] = await Promise.all([
          fetch("/api/expenses" + (expQuery ? "?" + expQuery : "")),
          fetch("/api/summary" + (sumQuery ? "?" + sumQuery : "")),
          fetch("/api/summary/monthly"),
          fetch("/api/budgets/status")
        ]);

        if (!expRes.ok || !sumRes.ok || !monthlyRes.ok || !budgetRes.ok) {
          throw new Error("Failed to load expense data");
        }

        const [expenses, summary, monthly, budgetStatus] = await Promise.all([
          expRes.json(),
          sumRes.json(),
          monthlyRes.json(),
          budgetRes.json()
        ]);

        renderSummary(summary);
        renderExpenses(expenses);
        renderBudgets(budgetStatus);
        renderCharts(summary, monthly);
      } catch (err) {
        showError(err.message || "Network error loading data");
      }
    }

    function renderSummary(summary) {
      const totalNum = Number(summary.total || 0).toFixed(2);
      totalSpentEl.textContent = "Total spent: ₹" + totalNum;

      categorySummaryEl.replaceChildren();
      const byCategory = summary.byCategory || {};
      const categories = Object.keys(byCategory);

      if (categories.length === 0) {
        const span = document.createElement("span");
        span.textContent = "No expenses recorded for this range.";
        span.style.color = "#78716c";
        categorySummaryEl.appendChild(span);
        return;
      }

      categories.forEach((cat) => {
        const row = document.createElement("div");
        row.className = "summary-cat-line";

        const label = document.createElement("span");
        label.textContent = cat;

        const val = document.createElement("span");
        val.textContent = "₹" + Number(byCategory[cat]).toFixed(2);

        row.appendChild(label);
        row.appendChild(val);
        categorySummaryEl.appendChild(row);
      });
    }

    function renderBudgets(budgetStatus) {
      budgetMonthEl.textContent = budgetStatus.month || "";
      budgetListEl.replaceChildren();

      (budgetStatus.categories || []).forEach((item) => {
        const wrapper = document.createElement("div");
        wrapper.className = "budget-item";

        const header = document.createElement("div");
        header.className = "budget-header" + (item.overBudget ? " over" : "");

        const nameSpan = document.createElement("span");
        nameSpan.textContent = item.category;

        const statSpan = document.createElement("span");
        const spentStr = "₹" + Number(item.spent).toFixed(2);
        if (item.budget === null) {
          statSpan.textContent = spentStr + " / No budget";
        } else {
          const budgetStr = "₹" + Number(item.budget).toFixed(2);
          const statusSuffix = item.overBudget
            ? " (Over by ₹" + Math.abs(item.remaining).toFixed(2) + ")"
            : " (₹" + Number(item.remaining).toFixed(2) + " left)";
          statSpan.textContent = spentStr + " / " + budgetStr + statusSuffix;
        }

        header.appendChild(nameSpan);
        header.appendChild(statSpan);

        const track = document.createElement("div");
        track.className = "budget-bar-track";

        const fill = document.createElement("div");
        fill.className = "budget-bar-fill" + (item.overBudget ? " over-budget" : "");

        let pct = 0;
        if (item.budget !== null) {
          if (item.budget === 0) {
            pct = item.spent > 0 ? 100 : 0;
          } else {
            pct = Math.min(100, Math.round((item.spent / item.budget) * 100));
          }
        }
        fill.style.width = pct + "%";

        track.appendChild(fill);
        wrapper.appendChild(header);
        wrapper.appendChild(track);
        budgetListEl.appendChild(wrapper);
      });
    }

    function renderCharts(summary, monthly) {
      if (typeof Chart === "undefined") return;

      const byCategory = summary.byCategory || {};
      const catLabels = Object.keys(byCategory);
      const catData = catLabels.map((k) => byCategory[k]);

      if (categoryChartInstance) categoryChartInstance.destroy();
      const catCtx = document.getElementById("categoryChart").getContext("2d");
      categoryChartInstance = new Chart(catCtx, {
        type: "doughnut",
        data: {
          labels: catLabels.length ? catLabels : ["No Data"],
          datasets: [
            {
              data: catData.length ? catData : [1],
              backgroundColor: catData.length
                ? ["#18181b", "#2d6a4f", "#b45309", "#9a3412", "#78716c"]
                : ["#e5e0d5"],
              borderWidth: 2,
              borderColor: "#ffffff"
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "62%",
          plugins: {
            title: { display: true, text: "By Category", color: "#18181b" },
            legend: { labels: { color: "#57534e", boxWidth: 12 } }
          }
        }
      });

      const monthLabels = (monthly || []).map((m) => m.month);
      const monthData = (monthly || []).map((m) => m.total);

      if (monthlyChartInstance) monthlyChartInstance.destroy();
      const monthCtx = document.getElementById("monthlyChart").getContext("2d");
      monthlyChartInstance = new Chart(monthCtx, {
        type: "bar",
        data: {
          labels: monthLabels,
          datasets: [
            {
              label: "Total (₹)",
              data: monthData,
              backgroundColor: "#18181b",
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: { display: true, text: "Monthly Trend", color: "#18181b" },
            legend: { display: false }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: "#57534e" } },
            y: { beginAtZero: true, grid: { color: "#f0ede6" }, ticks: { color: "#57534e" } }
          }
        }
      });
    }

    function renderExpenses(expenses) {
      listEl.replaceChildren();

      if (!expenses || expenses.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.textContent = "No expenses found.";
        listEl.appendChild(empty);
        return;
      }

      expenses.forEach((item) => {
        const li = document.createElement("li");

        const infoDiv = document.createElement("div");
        infoDiv.className = "expense-info";

        const titleSpan = document.createElement("span");
        titleSpan.className = "expense-title";
        titleSpan.textContent = item.title;

        const metaDiv = document.createElement("div");
        metaDiv.className = "expense-meta";

        const catSpan = document.createElement("span");
        catSpan.className = "expense-cat";
        catSpan.textContent = item.category;

        const dateSpan = document.createElement("span");
        dateSpan.textContent = item.date || "";

        metaDiv.appendChild(catSpan);
        metaDiv.appendChild(dateSpan);

        infoDiv.appendChild(titleSpan);
        infoDiv.appendChild(metaDiv);

        const rightDiv = document.createElement("div");
        rightDiv.className = "expense-right";

        const amountSpan = document.createElement("span");
        amountSpan.className = "expense-amount";
        amountSpan.textContent = "₹" + Number(item.amount).toFixed(2);

        const editBtn = document.createElement("button");
        editBtn.className = "btn-edit";
        editBtn.textContent = "Edit";
        editBtn.setAttribute("type", "button");
        editBtn.addEventListener("click", () => startEdit(item));

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn-delete";
        deleteBtn.textContent = "Delete";
        deleteBtn.setAttribute("type", "button");
        deleteBtn.addEventListener("click", () => deleteExpense(item.id));

        rightDiv.appendChild(amountSpan);
        rightDiv.appendChild(editBtn);
        rightDiv.appendChild(deleteBtn);

        li.appendChild(infoDiv);
        li.appendChild(rightDiv);
        listEl.appendChild(li);
      });
    }

    async function deleteExpense(id) {
      clearError();
      try {
        const res = await fetch("/api/expenses/" + id, {
          method: "DELETE"
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || "Failed to delete expense");
        }
        if (editingId === id) resetFormMode();
        await loadData();
      } catch (err) {
        showError(err.message);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const payload = {
        title: titleInput.value.trim(),
        amount: parseFloat(amountInput.value),
        category: categorySelect.value,
        date: dateInput.value
      };

      try {
        const url = editingId ? "/api/expenses/" + editingId : "/api/expenses";
        const method = editingId ? "PUT" : "POST";
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Failed to save expense");
        }

        resetFormMode();
        titleInput.focus();
        await loadData();
      } catch (err) {
        showError(err.message);
      }
    });

    budgetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const cat = budgetCategory.value;
      const amount = parseFloat(budgetAmount.value);

      try {
        const res = await fetch("/api/budgets/" + encodeURIComponent(cat), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Failed to save budget");
        }
        budgetAmount.value = "";
        await loadData();
      } catch (err) {
        showError(err.message);
      }
    });

    cancelEditBtn.addEventListener("click", resetFormMode);

    [filterCategory, filterFrom, filterTo, filterSort].forEach((el) => {
      el.addEventListener("change", () => {
        clearError();
        loadData();
      });
    });

    clearFiltersBtn.addEventListener("click", () => {
      filterCategory.value = "";
      filterFrom.value = "";
      filterTo.value = "";
      filterSort.value = "date_desc";
      clearError();
      loadData();
    });

    exportCsvBtn.addEventListener("click", () => {
      const query = buildFilterParams(true);
      window.location.href = "/api/export.csv" + (query ? "?" + query : "");
    });

    loadData();
  </script>
</body>
</html>
